id: pr-review
name: Pull Request Review
version: 0.1.0
description: Reviews code changes for correctness, maintainability, tests, and risk.
instructions: instructions.md
inputs:
  - name: repo
    type: string
    required: true
  - name: diff
    type: string
    required: true
  - name: risk_level
    type: enum
    required: true
    values: [low, medium, high]
outputs:
  type: object
  schema:
    summary: string
    blocking_issues: array
    non_blocking_suggestions: array
    test_recommendations: array
    deployment_risk: string
tools: []
guardrails:
  require_citations: false
  no_secret_exfiltration: true
  confirm_before_write: true
targets:
  openai:
    expose_as_mcp_tool: true
  claude:
    package_as_skill: true
  cursor:
    expose_as_rule_and_mcp_tool: true
examples:
  - examples/basic-risk.json
  - examples/missing-tests.json
